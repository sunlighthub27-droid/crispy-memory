<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunlight Short — ย่อสคริปต์</title>
<style>
  :root {
    --bg: #050208;
    --card: rgba(20, 6, 32, 0.85);
    --primary: #a855f7;
    --primary-light: #d8b4fe;
    --text: #ffffff;
    --sub: #c9a5e8;
    --dim: #6d5a85;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', 'Segoe UI', sans-serif; }
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image: 
      radial-gradient(circle at 20% 20%, rgba(168,85,247,0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(107,33,168,0.15) 0%, transparent 50%);
  }
  .app {
    width: 100%;
    max-width: 800px;
    background: var(--card);
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 20px;
    padding: 30px;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(168,85,247,0.2);
  }
  h1 {
    text-align: center;
    font-size: 26px;
    background: linear-gradient(180deg, #fff, #d8b4fe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .sub {
    text-align: center;
    color: var(--sub);
    font-size: 13px;
    margin-bottom: 25px;
  }
  textarea {
    width: 100%;
    height: 180px;
    background: rgba(10, 3, 18, 0.85);
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 12px;
    color: var(--primary-light);
    font-family: 'Courier New', monospace;
    padding: 15px;
    font-size: 13px;
    resize: vertical;
    outline: none;
    line-height: 1.5;
  }
  textarea:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(168,85,247,0.4); }
  .counter { text-align: right; color: var(--dim); font-size: 12px; margin-top: 5px; margin-bottom: 15px; }
  button {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #4c1d95, #a855f7);
    border: 1px solid rgba(168,85,247,0.8);
    border-radius: 12px;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    margin-bottom: 15px;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(168,85,247,0.5); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .result {
    display: none;
    margin-top: 20px;
    padding: 20px;
    background: rgba(10, 3, 18, 0.9);
    border: 1px solid var(--primary);
    border-radius: 12px;
  }
  .result-title {
    color: var(--primary-light);
    font-size: 13px;
    margin-bottom: 10px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .link-box {
    display: flex;
    gap: 10px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 8px;
    padding: 10px 15px;
    align-items: center;
    margin-bottom: 12px;
  }
  .link-box input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--primary-light);
    font-family: 'Courier New', monospace;
    font-size: 12px;
    outline: none;
    width: 100%;
  }
  .copy-btn {
    padding: 8px 14px;
    background: var(--primary);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    font-size: 12px;
    width: auto;
    margin: 0;
    white-space: nowrap;
  }
  .copy-btn:hover { background: #b975ff; transform: scale(1.05); }
  .loadstring-box {
    background: rgba(0,0,0,0.5);
    border: 1px dashed var(--primary);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
    position: relative;
  }
  .loadstring-label {
    color: var(--primary-light);
    font-size: 11px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .loadstring-code {
    color: #c084fc;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    word-break: break-all;
    line-height: 1.5;
  }
  .stats { color: var(--dim); font-size: 12px; margin-top: 10px; text-align: center; }
  .loading { text-align: center; color: var(--primary); padding: 20px; display: none; }
  .loading i { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .error { color: #ff6b6b; text-align: center; padding: 10px; display: none; word-break: break-all; font-size: 12px; }
  .info { color: var(--dim); font-size: 12px; text-align: center; margin-top: 15px; line-height: 1.6; }
  .badge-ok { color: #4ade80; font-weight: bold; }
</style>
</head>
<body>

<div class="app">
  <h1>⚡ Sunlight Short</h1>
  <p class="sub">วางสคริปต์ยาวๆ → ได้ลิงก์ Raw พร้อม Loadstring</p>
  
  <textarea id="input" placeholder="วางสคริปต์ยาวๆ ที่นี่..."></textarea>
  <div class="counter" id="counter">0 ตัวอักษร</div>
  
  <button id="saveBtn" onclick="shorten()">
    🔗 ย่อสคริปต์
  </button>
  
  <div class="loading" id="loading">
    <i>⚙️</i> กำลังฝากสคริปต์...
  </div>
  
  <div class="error" id="error"></div>
  
  <div class="result" id="result">
    <div class="result-title">✅ สคริปต์ของคุณพร้อมใช้งาน</div>
    
    <!-- Loadstring พร้อมใช้ -->
    <div class="loadstring-box">
      <div class="loadstring-label">🎯 Loadstring สำหรับ Executor</div>
      <div class="loadstring-code" id="loadstringCode"></div>
      <button class="copy-btn" style="margin-top:8px;width:100%;" onclick="copyLoadstring()">📋 คัดลอก Loadstring ทั้งหมด</button>
    </div>
    
    <!-- ลิงก์ Raw -->
    <div class="link-box">
      <input type="text" id="rawUrl" readonly>
      <button class="copy-btn" onclick="copyRaw()">📋 Raw</button>
    </div>
    
    <!-- ลิงก์หน้าเว็บ -->
    <div class="link-box">
      <input type="text" id="shortUrl" readonly>
      <button class="copy-btn" onclick="copyLink()">📋 Link</button>
    </div>
    
    <div class="stats" id="stats"></div>
  </div>
  
  <div class="info">
    💡 ลิงก์จะฝากไว้ที่ <b>jsonbin.io</b> — ฟรี ไม่ต้องมี backend เอง
  </div>
</div>

<script>
/* ============================================ */
/* 🔑 ตั้งค่าตรงนี้ — เอามาจาก jsonbin.io      */
/* ============================================ */
const JSONBIN_KEY = "ใส่_API_KEY_ของคุุณ";  // เช่น "$2a$10$abcdefg..."
const JSONBIN_BIN = "ใส่_BIN_ID_ของคุณ";   // เช่น "65a1b2c3d4e5f6..."
/* ============================================ */

const $ = id => document.getElementById(id);

// นับตัวอักษร
$('input').addEventListener('input', () => {
  $('counter').textContent = $('input').value.length.toLocaleString() + ' ตัวอักษร';
});

// สุ่ม ID สั้น 8 ตัว
function shortId() {
  const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let id = '';
  for (let i = 0; i < 8; i++) id += chars[Math.floor(Math.random() * chars.length)];
  return id;
}

// ย่อสคริปต์
async function shorten() {
  const code = $('input').value.trim();
  
  if (!code) {
    alert('กรุณาวางสคริปต์ก่อนครับ');
    return;
  }
  
  if (JSONBIN_KEY.includes('ใส่_') || JSONBIN_BIN.includes('ใส่_')) {
    alert('⚠️ กรุณาตั้งค่า JSONBIN_KEY และ JSONBIN_BIN ในโค้ดก่อนครับ');
    return;
  }
  
  $('saveBtn').disabled = true;
  $('loading').style.display = 'block';
  $('error').style.display = 'none';
  $('result').style.display = 'none';
  
  try {
    const id = shortId();
    
    // ดึงข้อมูลเดิม
    const getRes = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    
    if (!getRes.ok) throw new Error('โหลดข้อมูลเดิมไม่สำเร็จ');
    
    const getData = await getRes.json();
    const allData = getData.record || {};
    
    // เพิ่มข้อมูลใหม่
    allData[id] = {
      code: code,
      created: Date.now()
    };
    
    // บันทึกกลับ
    const putRes = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_KEY
      },
      body: JSON.stringify(allData)
    });
    
    if (!putRes.ok) {
      const errText = await putRes.text();
      throw new Error('บันทึกไม่สำเร็จ: ' + errText);
    }
    
    // สร้างลิงก์ต่างๆ
    // ใช้ API endpoint ของเราที่จะดึงข้อมูลจาก jsonbin กลับมา
    const baseUrl = location.origin + location.pathname.replace(/\/[^\/]*$/, '/');
    const rawUrl = `${baseUrl}raw.html?id=${id}`;
    const viewUrl = `${baseUrl}?id=${id}`;
    
    // สร้าง loadstring
    const loadstringCode = `loadstring(game:HttpGet("${rawUrl}"))()`;
    
    // แสดงผล
    $('shortUrl').value = viewUrl;
    $('rawUrl').value = rawUrl;
    $('loadstringCode').textContent = loadstringCode;
    $('stats').innerHTML = `📏 สคริปต์ <b>${code.length.toLocaleString()}</b> ตัวอักษร → ลิงก์ <b>${rawUrl.length}</b> ตัวอักษร <span class="badge-ok">✅ สำเร็จ</span>`;
    $('result').style.display = 'block';
    
  } catch (err) {
    console.error(err);
    $('error').textContent = '❌ ' + err.message;
    $('error').style.display = 'block';
  } finally {
    $('saveBtn').disabled = false;
    $('loading').style.display = 'none';
  }
}

// คัดลอกฟังก์ชัน
function copyToClipboard(text, message) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      showToast(message);
    }).catch(() => fallbackCopy(text, message));
  } else {
    fallbackCopy(text, message);
  }
}

function fallbackCopy(text, message) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast(message);
  } catch (e) {
    showToast('❌ คัดลอกไม่สำเร็จ');
  }
  document.body.removeChild(ta);
}

function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = `
    position: fixed; bottom: 20px; right: 20px;
    background: linear-gradient(135deg, #4c1d95, #a855f7);
    color: #fff; padding: 12px 20px; border-radius: 8px;
    font-weight: bold; z-index: 9999; font-size: 14px;
    box-shadow: 0 10px 30px rgba(168,85,247,0.5);
    animation: slideIn 0.3s ease;
  `;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'opacity 0.3s';
    t.style.opacity = '0';
    setTimeout(() => t.remove(), 300);
  }, 2000);
}

function copyLink() { copyToClipboard($('shortUrl').value, '✅ คัดลอกลิงก์แล้ว!'); }
function copyRaw()  { copyToClipboard($('rawUrl').value, '✅ คัดลอก Raw URL แล้ว!'); }
function copyLoadstring() { copyToClipboard($('loadstringCode').textContent, '✅ คัดลอก Loadstring แล้ว!'); }
</script>

</body>
</html>
