<script>
/* ================= Particle ================= */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
class Particle {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height;
        this.size = Math.random()*2+0.5;
        this.speedX = (Math.random()-0.5)*0.5; this.speedY = (Math.random()-0.5)*0.5;
        this.opacity = Math.random()*0.5+0.1;
    }
    update() {
        this.x += this.speedX; this.y += this.speedY;
        if (this.x<0||this.x>canvas.width||this.y<0||this.y>canvas.height) this.reset();
    }
    draw() {
        ctx.fillStyle = `rgba(168,85,247,${this.opacity})`;
        ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill();
    }
}
for (let i=0;i<50;i++) particles.push(new Particle());
function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{p.update();p.draw();});
    requestAnimationFrame(animate);
}
animate();

/* ================= Toast ================= */
function showToast(m, type='default') {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    let ic = 'fa-circle-info';
    if (type==='success') ic='fa-circle-check';
    if (type==='warning') ic='fa-triangle-exclamation';
    t.innerHTML = `<i class="fa-solid ${ic}"></i> <span>${m}</span>`;
    c.appendChild(t);
    setTimeout(()=>{ t.style.animation='fadeOut 0.3s forwards'; setTimeout(()=>t.remove(),300); }, 3000);
}

function updateCounter(iId, cId) {
    const v = document.getElementById(iId).value;
    const l = v ? v.split('\n').length : 0;
    document.getElementById(cId).innerText = `${v.length} ตัวอักษร | ${l} บรรทัด`;
}

/* ================= Utils ================= */
function randName(min=18, max=28) {
    const c = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const len = Math.floor(Math.random()*(max-min+1))+min;
    let s = '_0x';
    for (let i=0;i<len;i++) s += c[Math.floor(Math.random()*c.length)];
    return s;
}
function bytesToHex(b) { return Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join(''); }
function bytesToB64(b) {
    let bin = '';
    for (let i=0;i<b.length;i++) bin += String.fromCharCode(b[i]);
    return btoa(bin);
}

/* ================= v3.0 Obfuscator =================
   8 ชั้น:
   1. UTF-8 → bytes
   2. + k1 + (i*3) % 251
   3. + k2 + (i*5) % 253
   4. + k3 + (i*7) % 257
   5. + k4 (static)
   6. XOR k5
   7. + k6 + ((i*i)%251)
   8. XOR (k7 + (i%256))
   9. - k8 (static)
   แล้ว reverse bytes + base64
*/
function obfuscateLua(code) {
    const enc = new TextEncoder().encode(code);
    const n = enc.length;
    const K = [];
    for (let i=0;i<8;i++) K.push(Math.floor(Math.random()*180)+40);

    // Encrypt 8 layers
    const out = new Uint8Array(n);
    for (let i=0;i<n;i++) {
        let v = enc[i];
        v = (v + K[0] + (i*3) % 251) % 256;
        v = (v + K[1] + (i*5) % 253) % 256;
        v = (v + K[2] + (i*7) % 257) % 256;
        v = (v + K[3]) % 256;
        v = (v ^ K[4]) % 256;
        v = (v + K[5] + ((i*i) % 251)) % 256;
        v = (v ^ ((K[6] + i) % 256)) % 256;
        v = (v - K[7] + 256) % 256;
        out[i] = v;
    }

    // Reverse bytes
    const rev = new Uint8Array(n);
    for (let i=0;i<n;i++) rev[i] = out[n-1-i];

    // Base64 encode
    const b64 = bytesToB64(rev);
    // Reverse base64 string
    const b64rev = b64.split('').reverse().join('');

    // Generate variable names
    const V = {};
    'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(k => V[k] = randName());

    // Split b64 into 4 parts
    const partLen = Math.ceil(b64rev.length / 4);
    const p1 = b64rev.substring(0, partLen);
    const p2 = b64rev.substring(partLen, partLen*2);
    const p3 = b64rev.substring(partLen*2, partLen*3);
    const p4 = b64rev.substring(partLen*3);

    // Garbage blocks
    const g1 = `
local ${V.q}=${Math.floor(Math.random()*9999)}
local ${V.r}=${Math.floor(Math.random()*9999)}
local ${V.s}=${V.q}+${V.r}
local ${V.t}=${V.s}*2-${V.q}
local ${V.u}=(${V.t}~=nil) and ${V.t} or 0`;

    const g2 = `
local ${V.v}=function(a,b,c)
    local r=0
    for i=1,a do r=r+b-c end
    return r
end
local ${V.w}=${V.v}(${Math.floor(Math.random()*10)+1},${Math.floor(Math.random()*50)},${Math.floor(Math.random()*30)})`;

    const g3 = `
local ${V.x}={}
for i=1,${Math.floor(Math.random()*20)+5} do
    ${V.x}[i]=(i*i+${Math.floor(Math.random()*100)})%256
end
local ${V.y}=#${V.x}`;

    // Dead code functions
    const dead = `
local function ${V.z1}(a)
    if a==nil then return 0 end
    return a
end
local function ${V.z2}(a,b)
    local c=a
    for i=1,b do c=c+1 end
    return c
end`;

    // Lookup table
    const lk = `local ${V.l1}={}`;
    let lkCode = `local ${V.l1}={}`;
    for (let i=0;i<64;i++) {
        const ch = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'[i];
        lkCode += `${V.l1}[${i+1}]="${ch}"`;
        if (i<63) lkCode += '\n';
    }

/* ================= Process ================= */
function processLock() {
    const input = document.getElementById('inputScript').value.trim();
    if (!input) { showToast('กรุณาวางสคริปต์ก่อนกด Lock Script!','warning'); return; }

    const statusBox = document.getElementById('statusBox');
    const btn = document.getElementById('lockBtn');
    const pBar = document.getElementById('progressBar');
    const pText = document.getElementById('statusPercent');

    statusBox.style.display = 'block';
    btn.disabled = true; btn.style.opacity = '0.5';
    pBar.style.width = '0%'; pText.innerText = '0%';

    let p = 0;
    const iv = setInterval(() => {
        p += Math.floor(Math.random()*15)+10;
        if (p>100) p=100;
        pBar.style.width = p+'%'; pText.innerText = p+'%';
        if (p>=100) {
            clearInterval(iv);
            setTimeout(() => {
                const out = obfuscateLua(input);
                document.getElementById('outputScript').value = out;
                updateCounter('outputScript','outputCounter');
                statusBox.style.display = 'none';
                btn.disabled = false; btn.style.opacity = '1';
                showToast('เข้ารหัสและ ล็อคสคริปต์ สำเร็จ!','success');
            }, 300);
        }
    }, 100);
}

function copyResult() {
    const t = document.getElementById('outputScript').value;
    if (!t) { showToast('ยังไม่มีสคริปต์ให้คัดลอก!','warning'); return; }
    navigator.clipboard.writeText(t).then(()=>showToast('คัดลอกแล้ว!','success'))
    .catch(()=>{
        const ta = document.createElement('textarea');
        ta.value = t; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); showToast('คัดลอกแล้ว!','success'); }
        catch(e){ showToast('คัดลอกไม่สำเร็จ!','warning'); }
        document.body.removeChild(ta);
    });
}
function downloadResult() {
    const t = document.getElementById('outputScript').value;
    if (!t) { showToast('ยังไม่มีสคริปต์ให้ดาวน์โหลด!','warning'); return; }
    const blob = new Blob([t], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'locked_script.lua';
    a.click(); URL.revokeObjectURL(a.href);
    showToast('ดาวน์โหลด locked_script.lua แล้ว!','success');
}
