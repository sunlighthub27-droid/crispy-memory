<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunlight Short — ย่อสคริปต์</title>
<style>
  :root {
    --bg: #050208;
    --card: rgba(20, 6, 32, 0.85);
    --primary: #a855f7;
    --primary-light: #d8b4fe;
    --text: #ffffff;
    --sub: #c9a5e8;
    --dim: #6d5a85;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', 'Segoe UI', sans-serif; }
  body {
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background-image: 
      radial-gradient(circle at 20% 20%, rgba(168,85,247,0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(107,33,168,0.15) 0%, transparent 50%);
  }
  .app {
    width: 100%; max-width: 800px;
    background: var(--card);
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 20px; padding: 30px;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(168,85,247,0.2);
  }

  /* ============ หัวข้อ ============ */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 24px; font-weight: 700;
    color: #ffffff;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(168,85,247,0.5);
  }
  /* ไอคอนสายฟ้า SVG ที่วาดเอง */
  .bolt-icon {
    width: 28px;
    height: 28px;
    display: inline-block;
    filter: drop-shadow(0 0 8px rgba(168,85,247,0.8));
  }
  .bolt-icon svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #d8b4fe;
    stroke-width: 2;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .bracket {
    color: var(--primary);
    font-size: 22px;
    font-weight: 300;
    opacity: 0.7;
  }
  .sub {
    text-align: center; color: var(--sub);
    font-size: 13px; margin-bottom: 25px;
    letter-spacing: 0.5px;
  }
  .sub::before { content: '◆ '; color: var(--primary); font-size: 10px; }
  .sub::after { content: ' ◆'; color: var(--primary); font-size: 10px; }

  /* ============ Textarea ============ */
  textarea {
    width: 100%; height: 180px;
    background: rgba(10, 3, 18, 0.85);
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 12px; color: var(--primary-light);
    font-family: 'Courier New', monospace;
    padding: 15px; font-size: 13px; resize: vertical; outline: none; line-height: 1.5;
  }
  textarea:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(168,85,247,0.4); }
  textarea::placeholder { color: rgba(216,180,254,0.3); }
  .counter {
    text-align: right; color: var(--dim);
    font-size: 12px; margin-top: 5px; margin-bottom: 15px;
    font-family: 'Courier New', monospace;
  }
  .counter::before { content: '▸ '; color: var(--primary); }

  /* ============ ปุ่มหลัก ============ */
  button {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, #4c1d95, #a855f7);
    border: 1px solid rgba(168,85,247,0.8);
    border-radius: 12px; color: #fff;
    font-size: 15px; font-weight: 700;
    cursor: pointer; transition: 0.3s;
    margin-bottom: 15px;
    letter-spacing: 1.5px; text-transform: uppercase;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(168,85,247,0.5); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ไอคอนลูกศรสามเหลี่ยมวาดจาก CSS */
  .arrow-icon {
    display: inline-block;
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 9px solid #d8b4fe;
    filter: drop-shadow(0 0 4px rgba(216,180,254,0.8));
  }

  /* ============ ผลลัพธ์ ============ */
  .result {
    display: none; margin-top: 20px; padding: 20px;
    background: rgba(10, 3, 18, 0.9);
    border: 1px solid var(--primary); border-radius: 12px;
  }
  .result-title {
    color: var(--primary-light); font-size: 13px;
    margin-bottom: 15px;
    text-transform: uppercase; letter-spacing: 2px; font-weight: 600;
    display: flex; align-items: center; gap: 10px;
  }

  /* ไอคอนเครื่องหมายถูกในกรอบ (วาดจาก SVG) */
  .check-icon {
    width: 22px; height: 22px;
    display: inline-block;
    filter: drop-shadow(0 0 6px rgba(168,85,247,0.8));
  }
  .check-icon svg {
    width: 100%; height: 100%;
    fill: none;
    stroke: #d8b4fe;
    stroke-width: 2.5;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  /* ============ Loadstring Box ============ */
  .loadstring-box {
    background: rgba(0,0,0,0.5);
    border: 1px dashed rgba(168,85,247,0.5);
    border-radius: 8px; padding: 15px; margin-bottom: 12px;
  }
  .loadstring-label {
    color: var(--sub); font-size: 11px;
    margin-bottom: 10px; text-transform: uppercase;
    letter-spacing: 1.5px;
    display: flex; align-items: center; gap: 8px;
  }

  /* ไอคอนลูกศรคู่ (วาดจาก CSS) */
  .dbl-arrow {
    display: inline-block;
    width: 0; height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 7px solid var(--primary);
    position: relative;
    margin-right: 4px;
  }
  .dbl-arrow::after {
    content: '';
    display: block;
    width: 0; height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 7px solid var(--primary);
    position: absolute;
    left: 9px;
    top: -5px;
  }

  .loadstring-code {
    color: #e9d5ff; font-family: 'Courier New', monospace;
    font-size: 12px; word-break: break-all; line-height: 1.6;
    background: rgba(0,0,0,0.4);
    padding: 12px; border-radius: 6px; margin-bottom: 12px;
    border-left: 3px solid var(--primary);
  }

  /* ============ ปุ่มคัดลอก ============ */
  .copy-btn {
    width: 100%; padding: 12px;
    background: transparent;
    border: 1px solid var(--primary);
    border-radius: 8px; color: var(--primary-light); font-weight: 700;
    cursor: pointer; font-size: 13px; transition: 0.2s;
    letter-spacing: 1.5px; text-transform: uppercase;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .copy-btn:hover { background: rgba(168,85,247,0.15); transform: scale(1.02); }

  /* ไอคอนสี่เหลี่ยมซ้อนกัน (วาดจาก CSS) */
  .copy-icon {
    position: relative;
    width: 14px; height: 16px;
    display: inline-block;
  }
  .copy-icon::before {
    content: '';
    position: absolute;
    left: 0; top: 0;
    width: 10px; height: 12px;
    border: 1.5px solid #d8b4fe;
    border-radius: 2px;
  }
  .copy-icon::after {
    content: '';
    position: absolute;
    left: 4px; top: 4px;
    width: 10px; height: 12px;
    border: 1.5px solid #d8b4fe;
    border-radius: 2px;
    background: rgba(20,6,32,0.9);
  }

  /* ============ Stats ============ */
  .stats {
    color: var(--dim); font-size: 12px;
    margin-top: 12px; text-align: center;
    font-family: 'Courier New', monospace;
    display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
  }

  /* ไอคอนข้าวหลามตัด (วาดจาก CSS) */
  .diamond {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--primary);
    transform: rotate(45deg);
    margin: 0 4px;
  }

  /* ============ Loading / Error / Info ============ */
  .loading {
    text-align: center; color: var(--primary);
    padding: 20px; display: none;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
    display: none;
    align-items: center; justify-content: center; gap: 10px;
  }
  .loading.show { display: flex; }

  /* ไอคอนวงกลมหมุน (วาดจาก CSS) */
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(168,85,247,0.2);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  .error {
    color: #ff9999; text-align: center;
    padding: 10px; display: none;
    word-break: break-all; font-size: 12px;
    display: none;
    align-items: center; justify-content: center; gap: 8px;
  }
  .error.show { display: flex; }

  /* ไอคอนกากบาท (วาดจาก CSS) */
  .x-icon {
    position: relative;
    width: 14px; height: 14px;
    display: inline-block;
  }
  .x-icon::before, .x-icon::after {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    width: 14px; height: 2px;
    background: #ff6b6b;
    border-radius: 1px;
  }
  .x-icon::before { transform: translate(-50%, -50%) rotate(45deg); }
  .x-icon::after  { transform: translate(-50%, -50%) rotate(-45deg); }

  .info {
    color: var(--dim); font-size: 12px;
    text-align: center; margin-top: 15px;
    line-height: 1.6; letter-spacing: 0.5px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }

  .badge-ok { color: #d8b4fe; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; }

  /* ไอคอนเครื่องหมายถูกเล็ก (วาดจาก CSS) */
  .check-small {
    display: inline-block;
    width: 10px; height: 6px;
    border-left: 2px solid #d8b4fe;
    border-bottom: 2px solid #d8b4fe;
    transform: rotate(-45deg) translateY(-2px);
    margin-right: 4px;
  }
</style>
</head>
<body>

<div class="app">
  <!-- ============ หัวข้อ ============ -->
  <div class="header">
    <span class="bracket">⟨</span>
    <span class="bolt-icon">
      <svg viewBox="0 0 24 24">
        <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
      </svg>
    </span>
    <h1>Sunlight Short</h1>
    <span class="bolt-icon">
      <svg viewBox="0 0 24 24">
        <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
      </svg>
    </span>
    <span class="bracket">⟩</span>
  </div>
  <p class="sub">วางสคริปต์ยาวๆ · ได้ Loadstring พร้อมใช้</p>

  <!-- ============ Input ============ -->
  <textarea id="input" placeholder="วางสคริปต์ยาวๆ ที่นี่..."></textarea>
  <div class="counter" id="counter">0 ตัวอักษร</div>

  <!-- ============ ปุ่มย่อ ============ -->
  <button id="saveBtn" onclick="shorten()">
    <span class="arrow-icon"></span>
    ย่อสคริปต์
  </button>

  <!-- ============ Loading ============ -->
  <div class="loading" id="loading">
    <span class="spinner"></span>
    กำลังฝากสคริปต์
  </div>

  <!-- ============ Error ============ -->
  <div class="error" id="error">
    <span class="x-icon"></span>
    <span id="errorText"></span>
  </div>

  <!-- ============ Result ============ -->
  <div class="result" id="result">
    <div class="result-title">
      <span class="check-icon">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="3" />
          <polyline points="8 12 11 15 16 9" />
        </svg>
      </span>
      Loadstring พร้อมใช้งาน
    </div>

    <div class="loadstring-box">
      <div class="loadstring-label">
        <span class="dbl-arrow"></span>
        ก๊อปปี้ไปวางใน executor ได้เลย
      </div>
      <div class="loadstring-code" id="loadstringCode"></div>
      <button class="copy-btn" onclick="copyLoadstring()">
        <span class="copy-icon"></span>
        คัดลอก Loadstring
      </button>
    </div>

    <div class="stats" id="stats"></div>
  </div>

  <!-- ============ Info ============ -->
  <div class="info">
    <span class="diamond"></span>
    ลิงก์จะฝากไว้ที่ <b>dpaste.com</b> — ใช้กับ Roblox ได้เลย
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

$('input').addEventListener('input', () => {
  $('counter').textContent = $('input').value.length.toLocaleString() + ' ตัวอักษร';
});

async function shorten() {
  const code = $('input').value.trim();

  if (!code) {
    alert('กรุณาวางสคริปต์ก่อนครับ');
    return;
  }

  $('saveBtn').disabled = true;
  $('loading').classList.add('show');
  $('error').classList.remove('show');
  $('result').style.display = 'none';

  try {
    const response = await fetch('https://dpaste.com/api/v2/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        content: code,
        syntax: 'lua',
        expiry_days: '365'
      })
    });

    if (!response.ok) throw new Error(`API Error: ${response.status}`);

    const rawUrl = (await response.text()).trim();
    const rawTxtUrl = rawUrl + '.txt';
    const loadstringCode = `loadstring(game:HttpGet("${rawTxtUrl}"))()`;

    $('loadstringCode').textContent = loadstringCode;
    $('stats').innerHTML = `
      <span class="diamond"></span>
      สคริปต์ <b>${code.length.toLocaleString()}</b> ตัวอักษร
      <span class="diamond"></span>
      Loadstring <b>${loadstringCode.length}</b> ตัวอักษร
      <span class="badge-ok"><span class="check-small"></span>สำเร็จ</span>
    `;
    $('result').style.display = 'block';

    setTimeout(() => {
      copyToClipboard(loadstringCode, 'คัดลอก Loadstring แล้ว');
    }, 500);

  } catch (err) {
    console.error(err);
    $('errorText').textContent = err.message;
    $('error').classList.add('show');
  } finally {
    $('saveBtn').disabled = false;
    $('loading').classList.remove('show');
  }
}

function copyToClipboard(text, message) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast(message))
    .catch(() => fallbackCopy(text, message));
  } else {
    fallbackCopy(text, message);
  }
}

function fallbackCopy(text, message) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast(message); }
  catch (e) { showToast('คัดลอกไม่สำเร็จ'); }
  document.body.removeChild(ta);
}

function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = `
    position: fixed; bottom: 20px; right: 20px;
    background: rgba(20, 6, 32, 0.95);
    color: #d8b4fe; padding: 12px 20px;
    border: 1px solid #a855f7;
    border-left: 3px solid #a855f7;
    border-radius: 8px;
    font-weight: 600; z-index: 9999; font-size: 13px;
    letter-spacing: 1px;
    box-shadow: 0 10px 30px rgba(168,85,247,0.5);
    font-family: 'Courier New', monospace;
    display: flex; align-items: center; gap: 8px;
  `;
  t.innerHTML = '<span class="check-small" style="border-color:#d8b4fe;display:inline-block;"></span>' + msg;
  document.body.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'opacity 0.3s';
    t.style.opacity = '0';
    setTimeout(() => t.remove(), 300);
  }, 2000);
}

function copyLoadstring() {
  copyToClipboard($('loadstringCode').textContent, 'คัดลอก Loadstring แล้ว');
}
</script>

</body>
</html>
