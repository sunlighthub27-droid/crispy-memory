<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunlight Short — ย่อสคริปต์</title>
<style>
  :root {
    --bg: #050208;
    --card: rgba(20, 6, 32, 0.85);
    --primary: #a855f7;
    --primary-light: #d8b4fe;
    --text: #ffffff;
    --sub: #c9a5e8;
    --dim: #6d5a85;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', 'Segoe UI', sans-serif; }
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image: 
      radial-gradient(circle at 20% 20%, rgba(168,85,247,0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(107,33,168,0.15) 0%, transparent 50%);
  }
  .app {
    width: 100%;
    max-width: 800px;
    background: var(--card);
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 20px;
    padding: 30px;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(168,85,247,0.2);
  }
  h1 {
    text-align: center;
    font-size: 26px;
    background: linear-gradient(180deg, #fff, #d8b4fe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .sub {
    text-align: center;
    color: var(--sub);
    font-size: 13px;
    margin-bottom: 25px;
  }
  textarea {
    width: 100%;
    height: 220px;
    background: rgba(10, 3, 18, 0.85);
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 12px;
    color: var(--primary-light);
    font-family: 'Courier New', monospace;
    padding: 15px;
    font-size: 13px;
    resize: vertical;
    outline: none;
    line-height: 1.5;
  }
  textarea:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(168,85,247,0.4); }
  .counter { text-align: right; color: var(--dim); font-size: 12px; margin-top: 5px; margin-bottom: 15px; }
  button {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #4c1d95, #a855f7);
    border: 1px solid rgba(168,85,247,0.8);
    border-radius: 12px;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    margin-bottom: 15px;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(168,85,247,0.5); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .result {
    display: none;
    margin-top: 20px;
    padding: 20px;
    background: rgba(10, 3, 18, 0.9);
    border: 1px solid var(--primary);
    border-radius: 12px;
  }
  .result-title { color: var(--primary-light); font-size: 13px; margin-bottom: 10px; text-transform: uppercase; }
  .link-box {
    display: flex;
    gap: 10px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 8px;
    padding: 10px 15px;
    align-items: center;
    margin-bottom: 10px;
  }
  .link-box input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--primary-light);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    outline: none;
  }
  .copy-btn {
    padding: 8px 16px;
    background: var(--primary);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
    width: auto;
    margin: 0;
  }
  .stats { color: var(--dim); font-size: 12px; margin-top: 10px; text-align: center; }
  .loading { text-align: center; color: var(--primary); padding: 20px; display: none; }
  .loading i { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .error { color: #ff6b6b; text-align: center; padding: 10px; display: none; }
  .info { color: var(--dim); font-size: 12px; text-align: center; margin-top: 15px; line-height: 1.6; }
</style>
</head>
<body>

<div class="app">
  <h1>⚡ Sunlight Short</h1>
  <p class="sub">วางสคริปต์ยาวๆ → ได้ลิงก์สั้นๆ เอาไปแชร์ได้เลย</p>
  
  <textarea id="input" placeholder="วางสคริปต์ยาวๆ ที่นี่..."></textarea>
  <div class="counter" id="counter">0 ตัวอักษร</div>
  
  <button id="saveBtn" onclick="shorten()">
    🔗 ย่อสคริปต์
  </button>
  
  <div class="loading" id="loading">
    <i>⚙️</i> กำลังฝากสคริปต์...
  </div>
  
  <div class="error" id="error"></div>
  
  <div class="result" id="result">
    <div class="result-title">✅ ลิงก์ของคุณ</div>
    <div class="link-box">
      <input type="text" id="shortUrl" readonly>
      <button class="copy-btn" onclick="copyLink()">📋</button>
    </div>
    <div class="link-box">
      <input type="text" id="rawUrl" readonly>
      <button class="copy-btn" onclick="copyRaw()">📋 Raw</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  
  <div class="info">
    💡 ลิงก์จะถูกฝากไว้ที่ <b>pastefy.app</b> — เปิดได้ทุกที่ ไม่ต้องมี backend เอง
  </div>
</div>

<script>
/* ============================================ */
/* ตั้งค่า Pastefy API                          */
/* ============================================ */
const PASTEFY_API = "https://pastefy.app/api/v2";

/* ============================================ */
/* ตัวแปร                                       */
/* ============================================ */
const $ = id => document.getElementById(id);

// นับตัวอักษร
$('input').addEventListener('input', () => {
  $('counter').textContent = $('input').value.length.toLocaleString() + ' ตัวอักษร';
});

// ฟังก์ชันย่อสคริปต์
async function shorten() {
  const code = $('input').value.trim();
  
  if (!code) {
    alert('กรุณาวางสคริปต์ก่อนครับ');
    return;
  }
  
  // ปิดปุ่ม + แสดง loading
  $('saveBtn').disabled = true;
  $('loading').style.display = 'block';
  $('error').style.display = 'none';
  $('result').style.display = 'none';
  
  try {
    // เรียก Pastefy API เพื่อสร้าง paste ใหม่
    const response = await fetch(`${PASTEFY_API}/paste`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        content: code,
        title: 'Sunlight Script',
        visibility: 'UNLISTED',  // ไม่แสดงใน public แต่เข้าถึงได้ด้วยลิงก์
        type: 'lua'
      })
    });
    
    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(`API Error: ${response.status} - ${errorText}`);
    }
    
    const data = await response.json();
    
    // สร้างลิงก์
    const pasteId = data.id;
    const shortUrl = `https://pastefy.app/${pasteId}`;
    const rawUrl = `https://pastefy.app/api/v2/paste/${pasteId}/raw`;
    
    // แสดงผล
    $('shortUrl').value = shortUrl;
    $('rawUrl').value = rawUrl;
    $('stats').textContent = `📏 สคริปต์ ${code.length.toLocaleString()} ตัวอักษร → ลิงก์ ${shortUrl.length} ตัวอักษร`;
    $('result').style.display = 'block';
    
  } catch (err) {
    console.error(err);
    $('error').textContent = '❌ ' + err.message;
    $('error').style.display = 'block';
  } finally {
    $('saveBtn').disabled = false;
    $('loading').style.display = 'none';
  }
}

// คัดลอกลิงก์
function copyLink() {
  copyToClipboard($('shortUrl').value, '✅ คัดลอกลิงก์แล้ว!');
}

// คัดลอก Raw
function copyRaw() {
  copyToClipboard($('rawUrl').value, '✅ คัดลอก Raw URL แล้ว!');
}

// ฟังก์ชันคัดลอก
function copyToClipboard(text, message) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert(message);
    }).catch(() => {
      fallbackCopy(text, message);
    });
  } else {
    fallbackCopy(text, message);
  }
}

function fallbackCopy(text, message) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    alert(message);
  } catch (e) {
    alert('คัดลอกไม่สำเร็จ');
  }
  document.body.removeChild(ta);
}
</script>

</body>
</html>
