<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บล็อคสคริป</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #050208;
            --bg-card: rgba(20, 6, 32, 0.75);
            --bg-input: rgba(10, 3, 18, 0.85);
            --primary: #a855f7;
            --primary-glow: rgba(168, 85, 247, 0.4);
            --primary-hover: #b975ff;
            --secondary: #6b21a8;
            --primary-light: #d8b4fe;
            --accent-green: #c084fc;
            --accent-yellow: #e9d5ff;
            --border-purple: rgba(168, 85, 247, 0.25);
            --border-purple-bright: rgba(168, 85, 247, 0.8);
            --text-main: #ffffff;
            --text-sub: #c9a5e8;
            --text-dim: #6d5a85;
            --font-main: 'Kanit', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Animated Background Canvas */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Cyber Grid Glow Overlay */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(168, 85, 247, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(168, 85, 247, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            pointer-events: none;
        }

        /* Ambient Glow Orbs */
        .orb {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 1;
            pointer-events: none;
            opacity: 0.4;
            animation: orbFloat 10s infinite alternate ease-in-out;
        }
        .orb-1 {
            top: -100px;
            left: -100px;
            background: var(--primary);
        }
        .orb-2 {
            bottom: -100px;
            right: -100px;
            background: #4c1d95;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }

        /* Main Glass Container */
        .app-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 720px;
        }

        .container {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-purple);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(168, 85, 247, 0.15),
                inset 0 0 15px rgba(168, 85, 247, 0.05);
            transition: border-color 0.3s ease;
        }

        .container:hover {
            border-color: rgba(168, 85, 247, 0.45);
        }

        /* Header Styling */
        .header-box {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 20px;
            font-size: 12px;
            color: var(--primary-light);
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .badge-status i {
            font-size: 8px;
            color: var(--primary);
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff 30%, #d8b4fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px var(--primary-glow);
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 400;
            opacity: 0.85;
        }

        /* Feature Tags */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .feature-card {
            background: rgba(168, 85, 247, 0.05);
            border: 1px solid rgba(168, 85, 247, 0.18);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .feature-card i {
            color: var(--primary);
        }

        /* Labels & Info Row */
        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            color: var(--text-sub);
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        label i {
            color: var(--primary);
        }

        .counter-badge {
            font-size: 11px;
            color: var(--text-dim);
            font-family: var(--font-code);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* Textarea Container Styling */
        .editor-wrapper {
            position: relative;
            margin-bottom: 18px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(168, 85, 247, 0.2);
            transition: all 0.3s ease;
            background-color: var(--bg-input);
        }

        .editor-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        textarea {
            width: 100%;
            height: 140px;
            background-color: transparent;
            border: none;
            color: var(--primary-light);
            font-family: var(--font-code);
            padding: 14px;
            font-size: 13px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            user-select: text;
            display: block;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-family: var(--font-main);
        }

        /* Custom Scrollbar */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }
        textarea::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* Lock Button Styling */
        button {
            position: relative;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4c1d95 0%, #a855f7 100%);
            border: 1px solid var(--border-purple-bright);
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.35);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.55);
            background: linear-gradient(135deg, #5b21b6 0%, #b975ff 100%);
        }

        button:active {
            transform: translateY(1px) scale(0.99);
        }

        /* Copy & Action Buttons */
        .action-group {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .copy-btn {
            flex: 2;
            background: linear-gradient(135deg, #1a0a2e 0%, #3b1361 100%);
            border: 1px solid rgba(168, 85, 247, 0.4);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            margin-bottom: 0;
        }

        .copy-btn:hover {
            background: linear-gradient(135deg, #26103f 0%, #6b21a8 100%);
            border-color: var(--primary);
            box-shadow: 0 6px 20px rgba(107, 33, 168, 0.5);
        }

        .download-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: none;
            margin-bottom: 0;
            font-size: 14px;
        }

        .download-btn:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: var(--primary-light);
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.2);
        }

        /* Status & Progress Bar */
        .status-box {
            display: none;
            margin-bottom: 18px;
            background: rgba(15, 5, 25, 0.9);
            border: 1px solid var(--border-purple);
            border-radius: 10px;
            padding: 12px 15px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .status {
            color: var(--accent-yellow);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0;
            animation: none;
        }

        .status-percent {
            color: var(--primary);
            font-family: var(--font-code);
            font-size: 12px;
            font-weight: bold;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #a855f7, #e9d5ff);
            border-radius: 10px;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px var(--primary);
        }

        /* Footer Section */
        footer {
            margin-top: 25px;
            text-align: center;
            background: rgba(12, 4, 20, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.18);
            border-radius: 14px;
            padding: 18px;
            position: relative;
        }

        .footer-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .social-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(168, 85, 247, 0.07);
            border: 1px solid rgba(168, 85, 247, 0.22);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-main);
            font-weight: 500;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .social-badge i {
            font-size: 14px;
        }

        .social-badge.yt i { color: #ff4d4d; }
        .social-badge.tt i { color: #d8b4fe; }

        .social-badge:hover {
            background: rgba(168, 85, 247, 0.18);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .discord-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px;
            background: rgba(88, 101, 242, 0.15);
            border: 1px solid rgba(88, 101, 242, 0.4);
            border-radius: 8px;
            color: #5865F2;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .discord-btn:hover {
            background: rgba(88, 101, 242, 0.3);
            border-color: #5865F2;
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.3);
            color: #ffffff;
        }

        /* Toast Alert Container */
        #toastContainer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            min-width: 280px;
            padding: 12px 18px;
            background: rgba(20, 6, 32, 0.95);
            border: 1px solid var(--primary);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            backdrop-filter: blur(10px);
        }

        .toast.success {
            border-color: var(--accent-green);
            border-left-color: var(--accent-green);
        }

        .toast.warning {
            border-color: var(--accent-yellow);
            border-left-color: var(--accent-yellow);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { transform: translateX(100%); opacity: 0; }
        }

        /* Responsive Layout Adjustments */
        @media (max-width: 580px) {
            .container {
                padding: 20px 15px;
            }
            .features-grid {
                grid-template-columns: 1fr;
            }
            .action-group {
                flex-direction: column;
            }
            .download-btn {
                width: 100%;
            }
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<script>
// --- Canvas Particle Effect ---
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');

let particles = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
    constructor() {
        this.reset();
    }
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.speedY = (Math.random() - 0.5) * 0.5;
        this.opacity = Math.random() * 0.5 + 0.1;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
            this.reset();
        }
    }
    draw() {
        ctx.fillStyle = `rgba(168, 85, 247, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

for (let i = 0; i < 50; i++) {
    particles.push(new Particle());
}

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
        p.update();
        p.draw();
    });
    requestAnimationFrame(animateParticles);
}
animateParticles();

// --- Toast Notification System ---
function showToast(message, type = 'default') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    let icon = 'fa-circle-info';
    if (type === 'success') icon = 'fa-circle-check';
    if (type === 'warning') icon = 'fa-triangle-exclamation';

    toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
    container.appendChild(toast);

    setTimeout(() => {
        toast.style.animation = 'fadeOut 0.3s forwards';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// --- Character Counter ---
function updateCounter(inputId, counterId) {
    const val = document.getElementById(inputId).value;
    const lines = val ? val.split('\n').length : 0;
    document.getElementById(counterId).innerText = `${val.length} ตัวอักษร | ${lines} บรรทัด`;
}

// --- Main Obfuscator Script ---
function generateRandomVar(len) {
    const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
    let res = '_0x' + Math.floor(Math.random() * 0xFFFFFF).toString(16);
    for (let i = 0; i < len; i++) {
        res += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return res;
}

function processLock() {
    const input = document.getElementById('inputScript').value.trim();
    if (!input) {
        showToast('กรุณาวางสคริปต์ก่อนกด Lock Script!', 'warning');
        return;
    }

    const statusBox = document.getElementById('statusBox');
    const lockBtn = document.getElementById('lockBtn');
    const progressBar = document.getElementById('progressBar');
    const statusPercent = document.getElementById('statusPercent');
    
    statusBox.style.display = 'block';
    lockBtn.disabled = true;
    lockBtn.style.opacity = '0.5';
    progressBar.style.width = '0%';
    statusPercent.innerText = '0%';

    let progress = 0;
    const interval = setInterval(() => {
        progress += Math.floor(Math.random() * 15) + 10;
        if (progress > 100) progress = 100;
        
        progressBar.style.width = progress + '%';
        statusPercent.innerText = progress + '%';

        if (progress >= 100) {
            clearInterval(interval);
            setTimeout(() => {
                const obfuscated = obfuscateLua(input);
                document.getElementById('outputScript').value = obfuscated;
                updateCounter('outputScript', 'outputCounter');
                
                statusBox.style.display = 'none';
                lockBtn.disabled = false;
                lockBtn.style.opacity = '1';
                showToast('เข้ารหัสและ ล็อคสคริปต์ สำเร็จเรียบร้อย!', 'success');
            }, 300);
        }
    }, 100);
}

function copyResult() {
    const textToCopy = document.getElementById('outputScript').value;
    if (!textToCopy) {
        showToast('ยังไม่มีสคริปต์ที่โดนล็อกให้คัดลอก!', 'warning');
        return;
    }

    navigator.clipboard.writeText(textToCopy).then(() => {
        showToast('คัดลอก Script เรียบร้อยแล้ว!', 'success');
    }).catch(() => {
        // Fallback method
        const tempTextArea = document.createElement("textarea");
        tempTextArea.value = textToCopy;
        document.body.appendChild(tempTextArea);
        tempTextArea.select();
        try {
            document.execCommand('copy');
            showToast('คัดลอก Script เรียบร้อยแล้ว!', 'success');
        } catch (err) {
            showToast('เกิดข้อผิดพลาดในการคัดลอก!', 'warning');
        }
        document.body.removeChild(tempTextArea);
    });
}

function downloadResult() {
    const textToDownload = document.getElementById('outputScript').value;
    if (!textToDownload) {
        showToast('ยังไม่มีสคริปต์ให้ดาวน์โหลด!', 'warning');
        return;
    }

    const blob = new Blob([textToDownload], { type: "text/plain;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "locked_script.lua";
    link.click();
    URL.revokeObjectURL(link.href);
    showToast('ดาวน์โหลดไฟล์ locked_script.lua แล้ว!', 'success');
}
