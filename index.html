            --bg-card: rgba(20, 6, 32, 0.75);
            --bg-input: rgba(10, 3, 18, 0.85);
            --primary: #a855f7;
            --primary-glow: rgba(168, 85, 247, 0.4);
            --secondary: #6b21a8;
            --primary-light: #d8b4fe;
            --border-purple: rgba(168, 85, 247, 0.25);
            --text-main: #ffffff;
            --text-sub: #c9a5e8;
            --text-dim: #6d5a85;

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); user-select: none; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);

            padding: 30px 15px;
            position: relative;
            overflow-x: hidden;

        #bgCanvas { position: fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }

        .grid-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;

                linear-gradient(90deg, rgba(168, 85, 247, 0.04) 1px, transparent 1px);

        @keyframes orbFloat {

        @keyframes bannerGlow {

        @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }

<script>
/* ================= Particle Background ================= */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random()*canvas.width;
        this.y = Math.random()*canvas.height;
        this.size = Math.random()*2+0.5;
        this.speedX = (Math.random()-0.5)*0.5;
        this.speedY = (Math.random()-0.5)*0.5;
        this.opacity = Math.random()*0.5+0.1;
    }
    update() {
        this.x += this.speedX; this.y += this.speedY;
        if (this.x<0||this.x>canvas.width||this.y<0||this.y>canvas.height) this.reset();
    }
    draw() {
        ctx.fillStyle = `rgba(168,85,247,${this.opacity})`;
        ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill();
    }
}
for (let i=0;i<50;i++) particles.push(new Particle());
function animateParticles() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{p.update();p.draw();});
    requestAnimationFrame(animateParticles);
}
animateParticles();

/* ================= Toast ================= */
function showToast(msg, type='default') {
    const container = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    let icon = 'fa-circle-info';
    if (type==='success') icon = 'fa-circle-check';
    if (type==='warning') icon = 'fa-triangle-exclamation';
    t.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${msg}</span>`;
    container.appendChild(t);
    setTimeout(()=>{ t.style.animation = 'fadeOut 0.3s forwards'; setTimeout(()=>t.remove(),300); }, 3000);
}

/* ================= Counter ================= */
function updateCounter(inputId, counterId) {
    const v = document.getElementById(inputId).value;
    const lines = v ? v.split('\n').length : 0;
    document.getElementById(counterId).innerText = `${v.length} ตัวอักษร | ${lines} บรรทัด`;
}

/* ================= Utils ================= */
function randName(min=15, max=25) {
    const c = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const len = Math.floor(Math.random()*(max-min+1))+min;
    let s = '_0x';
    for (let i=0;i<len;i++) s += c[Math.floor(Math.random()*c.length)];
    return s;
}
function bytesToHex(bytes) {
    return Array.from(bytes).map(b => b.toString(16).padStart(2,'0')).join('');
}
function bytesToBase64(bytes) {
    let bin = '';
    for (let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
}

/* ================= Obfuscator ระดับสูง =================
   ขั้นตอน:
   1. UTF-8 encode → bytes
   2. Layer 1: XOR ด้วย key1 + position (rolling)
   3. Layer 2: XOR ด้วย key2 + position (rolling)
   4. Layer 3: XOR ด้วย key3 (static)
   5. Layer 4: XOR ด้วย key4 (static)
   6. แปลงเป็น hex
   7. Base64 encode
   8. ฝังตัวถอดรหัสที่ทำย้อนกลับทั้ง 4 layer
======================================================== */
function obfuscateLua(code) {
    const encoder = new TextEncoder();
    const src = encoder.encode(code);
    const n = src.length;

    const k1 = Math.floor(Math.random()*200)+30;
    const k2 = Math.floor(Math.random()*200)+30;
    const k3 = Math.floor(Math.random()*200)+30;
    const k4 = Math.floor(Math.random()*200)+30;

    // Layer 1+2+3+4 encryption
    const enc = new Uint8Array(n);
    for (let i=0;i<n;i++) {
        let v = src[i];
        v = (v + k1 + (i % 251)) % 256;
        v = (v + k2 + ((i*7) % 253)) % 256;
        v = (v + k3) % 256;
        v = (v ^ k4) % 256;
        enc[i] = v;
    }

    const hex = bytesToHex(enc);
    const b64 = bytesToBase64(enc);

    // ชื่อตัวแปรขยะ (สุ่มใหม่ทุกครั้ง)
    const V = {};
    ['a','b','c','d','e','f','g','h','i','j','k','l','m','n','o','p','q','r','s','t','u','v','w','x','y','z']
        .forEach(k => V[k] = randName());

    // สร้าง garbage code (ทำให้อ่านยาก)
    const garbage1 = `
local ${V.q} = ${Math.floor(Math.random()*1000)}
local ${V.r} = ${Math.floor(Math.random()*1000)}
local ${V.s} = ${V.q} + ${V.r}
if ${V.s} < 0 then ${V.s} = 0 end`;

/* ================= Process ================= */
function processLock() {
    const input = document.getElementById('inputScript').value.trim();
    if (!input) { showToast('กรุณาวางสคริปต์ก่อนกด Lock Script!','warning'); return; }

    const statusBox = document.getElementById('statusBox');
    const lockBtn = document.getElementById('lockBtn');
    const pBar = document.getElementById('progressBar');
    const pText = document.getElementById('statusPercent');

    statusBox.style.display = 'block';
    lockBtn.disabled = true;
    lockBtn.style.opacity = '0.5';
    pBar.style.width = '0%';
    pText.innerText = '0%';

    let p = 0;
    const iv = setInterval(() => {
        p += Math.floor(Math.random()*15)+10;
        if (p>100) p=100;
        pBar.style.width = p+'%';
        pText.innerText = p+'%';
        if (p>=100) {
            clearInterval(iv);
            setTimeout(() => {
                const out = obfuscateLua(input);
                document.getElementById('outputScript').value = out;
                updateCounter('outputScript','outputCounter');
                statusBox.style.display = 'none';
                lockBtn.disabled = false;
                lockBtn.style.opacity = '1';
                showToast('เข้ารหัสและ ล็อคสคริปต์ สำเร็จ!','success');
            }, 300);
        }
    }, 100);
}

/* ================= Copy / Download ================= */
function copyResult() {
    const t = document.getElementById('outputScript').value;
    if (!t) { showToast('ยังไม่มีสคริปต์ให้คัดลอก!','warning'); return; }
    navigator.clipboard.writeText(t).then(()=>showToast('คัดลอกแล้ว!','success'))
    .catch(()=>{
        const ta = document.createElement('textarea');
        ta.value = t; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); showToast('คัดลอกแล้ว!','success'); }
        catch(e){ showToast('คัดลอกไม่สำเร็จ!','warning'); }
        document.body.removeChild(ta);
    });
}
function downloadResult() {
    const t = document.getElementById('outputScript').value;
    if (!t) { showToast('ยังไม่มีสคริปต์ให้ดาวน์โหลด!','warning'); return; }
    const blob = new Blob([t], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'locked_script.lua';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('ดาวน์โหลด locked_script.lua แล้ว!','success');
}
